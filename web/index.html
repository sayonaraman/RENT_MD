<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rent MD</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap&subset=cyrillic" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Rent MD Collection">
          <span class="brand-mark">R</span>
          <span>
            <strong>Rent MD</strong>
            <small>Residence Bureau</small>
          </span>
        </a>
        <div class="top-title">Актуальная аренда Кишинева</div>
      </header>

      <main>
        <section class="workspace" id="catalog">
          <aside class="filters" aria-label="Фильтры">
            <span id="resultCount" hidden>0</span>

            <label class="field">
              <span>Район</span>
              <div class="custom-select" id="districtSelect">
                <button type="button" class="select-trigger" id="districtTrigger" aria-haspopup="listbox" aria-expanded="false">
                  <span>Все районы</span>
                </button>
                <div class="select-menu" id="districtMenu" role="listbox" hidden></div>
              </div>
            </label>

            <div class="range-grid">
              <label class="field">
                <span>Цена от</span>
                <input id="minPrice" type="number" min="0" step="50" placeholder="300" />
              </label>
              <label class="field">
                <span>До</span>
                <input id="maxPrice" type="number" min="0" step="50" placeholder="900" />
              </label>
            </div>

            <div class="field">
              <span>Комнаты</span>
              <div class="segmented" id="roomsFilter">
                <button type="button" class="is-active" data-value="all">Все</button>
                <button type="button" data-value="1">1</button>
                <button type="button" data-value="2">2</button>
                <button type="button" data-value="3">3</button>
              </div>
            </div>

            <label class="toggle">
              <input id="petsFilter" type="checkbox" />
              <span>Животные</span>
            </label>

            <label class="toggle">
              <input id="kidsFilter" type="checkbox" />
              <span>Дети</span>
            </label>

            <label class="toggle">
              <input id="newBuildFilter" type="checkbox" />
              <span>Новострой</span>
            </label>
          </aside>

          <section class="catalog-panel">
            <div class="listing-grid" id="listingGrid"></div>
            <div class="empty-state" id="emptyState" hidden>
              <strong>Нет подходящих объявлений</strong>
              <button type="button" id="resetEmpty">Показать все</button>
            </div>
          </section>
        </section>
      </main>

      <footer class="site-footer">
        <span>Rent MD Residence Bureau © 2026</span>
      </footer>
    </div>

    <dialog class="listing-dialog" id="listingDialog">
      <button class="close-dialog" id="closeDialog" aria-label="Закрыть">×</button>
      <div id="dialogContent"></div>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
