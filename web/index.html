<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rent MD Collection</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Rent MD Collection">
          <span class="brand-mark">R</span>
          <span>
            <strong>Rent MD</strong>
            <small>Residence Bureau</small>
          </span>
        </a>
        <div class="top-title">Актуальная аренда Кишинева</div>
        <button class="ghost-button" id="resetTop">Reset</button>
      </header>

      <main>
        <section class="workspace" id="catalog">
          <aside class="filters" aria-label="Фильтры">
            <span id="resultCount" hidden>0</span>

            <label class="field">
              <span>Район</span>
              <select id="districtFilter">
                <option value="all">Все районы</option>
              </select>
            </label>

            <div class="range-grid">
              <label class="field">
                <span>Цена от</span>
                <input id="minPrice" type="number" min="0" step="50" placeholder="300" />
              </label>
              <label class="field">
                <span>До</span>
                <input id="maxPrice" type="number" min="0" step="50" placeholder="900" />
              </label>
            </div>

            <div class="field">
              <span>Комнаты</span>
              <div class="segmented" id="roomsFilter">
                <button class="is-active" data-value="all">Все</button>
                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
              </div>
            </div>

            <label class="toggle">
              <input id="petsFilter" type="checkbox" />
              <span>Животные</span>
            </label>

            <label class="toggle">
              <input id="kidsFilter" type="checkbox" />
              <span>Дети</span>
            </label>

            <label class="toggle">
              <input id="newBuildFilter" type="checkbox" />
              <span>Новострой</span>
            </label>
          </aside>

          <section class="catalog-panel">
            <div class="catalog-head">
              <div>
                <p class="eyebrow">Telegram listings, curated</p>
                <h2>Каталог</h2>
              </div>
              <div class="toolbar">
                <select id="sortFilter" aria-label="Сортировка">
                  <option value="fresh">Сначала новые</option>
                  <option value="priceAsc">Цена по возрастанию</option>
                  <option value="priceDesc">Цена по убыванию</option>
                  <option value="areaDesc">Больше площадь</option>
                </select>
              </div>
            </div>

            <div class="market-strip" id="insights">
              <div>
                <span>Средняя цена</span>
                <strong id="avgPrice">0 EUR</strong>
              </div>
              <div>
                <span>Свободно</span>
                <strong id="activeCount">0</strong>
              </div>
              <div>
                <span>Районы</span>
                <strong id="districtCount">0</strong>
              </div>
            </div>

            <div class="listing-grid" id="listingGrid"></div>
            <div class="empty-state" id="emptyState" hidden>
              <strong>Нет объявлений под выбранные фильтры</strong>
              <span>Измени район, цену или статус.</span>
            </div>
          </section>
        </section>
      </main>
    </div>

    <dialog class="listing-dialog" id="listingDialog">
      <button class="close-dialog" id="closeDialog" aria-label="Закрыть">×</button>
      <div id="dialogContent"></div>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
